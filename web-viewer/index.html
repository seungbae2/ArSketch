<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArSketch Web Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Connect Screen -->
    <div id="connect-screen" class="connect-screen">
      <div class="connect-card">
        <h1 class="connect-title">ArSketch</h1>
        <p class="connect-subtitle">Web Viewer</p>

        <form id="connect-form" autocomplete="off">
          <label for="server-url">Server URL</label>
          <input
            id="server-url"
            type="text"
            value=""
            placeholder="wss://your-project.livekit.cloud"
          />

          <label for="token">Token</label>
          <input
            id="token"
            type="text"
            value=""
            placeholder="Enter your access token"
          />

          <button id="connect-btn" type="submit">Connect</button>
        </form>

        <p id="error-message" class="error-message hidden"></p>
      </div>
    </div>

    <!-- Viewer Screen -->
    <div id="viewer-screen" class="viewer-screen hidden">
      <div id="viewer-container" class="viewer-container">
        <video id="remote-video" autoplay playsinline muted></video>
        <div id="drawing-overlay" class="drawing-overlay"></div>
      </div>

      <!-- Drawing Toolbar -->
      <div id="drawing-toolbar" class="drawing-toolbar">
        <div class="toolbar-section">
          <div id="mode-toggle" class="mode-toggle">
            <button class="mode-btn active" data-mode="AIR">Air</button>
            <button class="mode-btn" data-mode="SURFACE">Surface</button>
          </div>
        </div>
        <div class="toolbar-section">
          <div id="color-picker" class="color-picker">
            <button class="color-swatch active" data-color="-65536" style="background:#FF0000"></button>
            <button class="color-swatch" data-color="-30720" style="background:#FF8800"></button>
            <button class="color-swatch" data-color="-256" style="background:#FFFF00"></button>
            <button class="color-swatch" data-color="-16711936" style="background:#00FF00"></button>
            <button class="color-swatch" data-color="-16742145" style="background:#0088FF"></button>
            <button class="color-swatch" data-color="-7864065" style="background:#8800FF"></button>
            <button class="color-swatch" data-color="-1" style="background:#FFFFFF"></button>
            <button class="color-swatch" data-color="-16777216" style="background:#000000"></button>
          </div>
        </div>
        <div class="toolbar-section">
          <div id="thickness-picker" class="thickness-picker">
            <button class="thickness-btn" data-thickness="0.003">S</button>
            <button class="thickness-btn active" data-thickness="0.006">M</button>
            <button class="thickness-btn" data-thickness="0.012">L</button>
          </div>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-left">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Disconnected</span>
        </div>
        <div class="status-right">
          <span class="participant-icon">&#128100;</span>
          <span id="participant-count">0</span>
          <button id="disconnect-btn" class="disconnect-btn">Disconnect</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
